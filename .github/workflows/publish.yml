name: Publish

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Repository variables (not secrets): the Supabase anon key is public by
      # design and protected by the insert-only RLS policy in supabase/telemetry.sql.
      # Leave them unset to publish a build with telemetry and the CTA disabled.
      # Set at job level because `npm publish` rebuilds via prepack/prepublishOnly.
      VULNPILOT_SUPABASE_URL: ${{ vars.VULNPILOT_SUPABASE_URL }}
      VULNPILOT_SUPABASE_ANON_KEY: ${{ vars.VULNPILOT_SUPABASE_ANON_KEY }}
      VULNPILOT_WAITLIST_URL: ${{ vars.VULNPILOT_WAITLIST_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate version tag and repository metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error('Tag must match package.json version');
          const expected = `git+https://github.com/${process.env.RELEASE_REPOSITORY}.git`;
          if (pkg.repository?.url !== expected) throw new Error(`Set package.json repository.url to ${expected} before publishing with provenance`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build with telemetry and waitlist settings
        run: pnpm build
      - name: Check the bundle embeds the telemetry settings
        if: ${{ vars.VULNPILOT_SUPABASE_URL != '' }}
        run: grep -qF "$VULNPILOT_SUPABASE_URL" dist/cli.js
      # Authenticates with npm trusted publishing (GitHub OIDC via
      # `id-token: write`); no npm token is stored in the repository.
      - name: Publish with npm provenance
        run: npm publish --provenance --access public
