name: Site

# The website in site/ and the code it bundles from src/. Vercel builds
# nothing: this workflow regenerates every generated file and fails if the
# committed copy differs, then tests what Vercel will serve.

on:
  push:
    branches: [main]
    paths: &paths
      - 'site/**'
      - 'site-src/**'
      - 'site-tools/**'
      - 'src/**'
      - 'schema/**'
      - 'test/fixtures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/site.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate the visual baselines and upload them as an artifact for review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: Generated files, unit tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site-tools typecheck
      - run: pnpm --filter site-tools test
      - name: Regenerate the site and compare with the committed copy
        run: |
          pnpm --filter site-tools build
          if ! git diff --exit-code -- site; then
            echo "::error::site/ is out of date. Run 'pnpm --filter site-tools build' and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- site)" ]; then
            git status --porcelain -- site
            echo "::error::The build created files that are not committed."
            exit 1
          fi

  checks:
    name: Proof, links, budgets, security.txt, crawling, HTML validation
    needs: generated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site-tools check

  e2e:
    name: Browser tests (Chromium, Firefox, WebKit) and accessibility
    needs: generated
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site-tools exec playwright test --project=chromium --project=firefox --project=webkit
        env:
          CI: '1'
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: site-tools/playwright-report
          retention-days: 7

  visual:
    name: Visual regression (360, 768, 1280, 1440 px; light and dark)
    needs: generated
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Missing baselines (a new page or state) are generated here, on Linux,
      # uploaded for review, and the job fails until they are committed.
      - name: Compare with the committed baselines
        if: ${{ !inputs.update-snapshots }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm --filter site-tools exec playwright test --project=visual --update-snapshots=missing
          if [ -n "$(git status --porcelain -- site-tools/e2e/__screenshots__)" ]; then
            echo "::error::New visual baselines were generated. Download the visual-baselines artifact, review the images and commit them."
            echo "NEW_BASELINES=1" >> "$GITHUB_ENV"
            exit 1
          fi
        env:
          CI: '1'
      - name: Regenerate the baselines for review
        if: ${{ inputs.update-snapshots }}
        run: pnpm --filter site-tools exec playwright test --project=visual --update-snapshots=all
        env:
          CI: '1'
      - uses: actions/upload-artifact@v6
        if: ${{ always() && (inputs.update-snapshots || env.NEW_BASELINES == '1') }}
        with:
          name: visual-baselines
          path: site-tools/e2e/__screenshots__
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: visual-diff
          path: site-tools/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (home, docs, privacy at 100; scan at 95+ performance)
    needs: generated
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site-tools exec playwright install --with-deps chromium
      - run: pnpm --filter site-tools lighthouse
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse
          path: site-tools/.lighthouseci
          retention-days: 7
