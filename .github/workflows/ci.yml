name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: The npm package contains exactly the CLI's files
        run: |
          npm pack --dry-run --ignore-scripts --json > /tmp/pack.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const files = JSON.parse(fs.readFileSync('/tmp/pack.json', 'utf8'))[0].files.map((file) => file.path).sort();
            const expected = ['LICENSE', 'README.md', 'dist/cli.js', 'package.json', 'schema/report-v1.schema.json'];
            if (JSON.stringify(files) !== JSON.stringify(expected)) throw new Error('npm pack lists: ' + files.join(', '));
          "
      - name: Smoke-test JSON and the packed CLI (offline mock data)
        env:
          RELVET_MOCK: '1'
          RELVET_TELEMETRY: '0'
        run: |
          # Exit code 1 means "issues found", which the mock fixtures always produce.
          node dist/cli.js --path test/fixtures/projects/npm --json > /tmp/relvet-report.json || [ $? -eq 1 ]
          node --input-type=module -e "import fs from 'node:fs'; const r = JSON.parse(fs.readFileSync('/tmp/relvet-report.json', 'utf8')); if (r.schemaVersion !== '1.0.0' || r.summary.dependencies !== 4 || r.summary.activelyExploited !== 1) throw new Error('Unexpected report');"
          node dist/cli.js --sbom test/fixtures/sbom/cyclonedx.json --fail-on kev > /dev/null || [ $? -eq 1 ]
          pnpm pack
          npm exec --yes --package="./relvet-$(node -p "require('./package.json').version").tgz" -- relvet --path test/fixtures/projects/pnpm --json > /dev/null || [ $? -eq 1 ]
