name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke-test JSON and the packed CLI (offline mock data)
        env:
          VULNPILOT_MOCK: '1'
          VULNPILOT_TELEMETRY: '0'
        run: |
          # Exit code 1 means "issues found", which the mock fixtures always produce.
          node dist/cli.js --path test/fixtures/projects/npm --json > /tmp/vulnpilot-report.json || [ $? -eq 1 ]
          node --input-type=module -e "import fs from 'node:fs'; const r = JSON.parse(fs.readFileSync('/tmp/vulnpilot-report.json', 'utf8')); if (r.schemaVersion !== '1.0.0' || r.summary.dependencies !== 4 || r.summary.activelyExploited !== 1) throw new Error('Unexpected report');"
          node dist/cli.js --sbom test/fixtures/sbom/cyclonedx.json --fail-on kev > /dev/null || [ $? -eq 1 ]
          pnpm pack
          npm exec --yes --package="./vulnpilot-$(node -p "require('./package.json').version").tgz" -- vulnpilot --path test/fixtures/projects/pnpm --json > /dev/null || [ $? -eq 1 ]
